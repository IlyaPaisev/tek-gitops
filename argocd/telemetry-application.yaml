apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: telemetry-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/IlyaPaisev/tek-gitops.git
    targetRevision: main
    path: charts/telemetry-api

  destination:
    server: https://kubernetes.default.svc
    namespace: tek-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true